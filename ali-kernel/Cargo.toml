[package]
name = "ali-kernel"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "ali-kernel"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
hmac = "0.12"
jsonwebtoken = "9"
async-stream = "0.3"

# Config stacking
figment = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
rustc_version = { workspace = true }
hostname = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
