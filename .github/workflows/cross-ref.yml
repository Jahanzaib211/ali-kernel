name: Cross-Reference Isolation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  cross-ref-check:
    name: Fail if consumer-specific names appear in source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Run cross-reference check
        run: |
          uv run python3 scripts/test_no_cross_references.py
