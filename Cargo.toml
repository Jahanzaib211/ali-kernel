[workspace]
members = ["ali-kernel", "ali-tui"]
resolver = "2"

[workspace.dependencies]
ratatui = "0.28"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
